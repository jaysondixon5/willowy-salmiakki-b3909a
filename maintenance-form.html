<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Maintenance request form detection</title></head>
  <body>
    <form name="maintenance-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="maintenance-request" />
      <p hidden><label>Leave this field empty: <input name="bot-field" /></label></p>
      <input name="tenant_name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="property_address" type="text" />
      <select name="urgency"><option value="low">Low</option><option value="normal">Normal</option><option value="urgent">Urgent</option><option value="emergency">Emergency</option></select>
      <textarea name="issue_description"></textarea>
    </form>
  </body>
</html>
